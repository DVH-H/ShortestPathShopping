name: Add shopping list

on:
  workflow_dispatch:
    inputs:
      url:
        description: Shared Google Maps list link (https://maps.app.goo.gl/...)
        required: true
      name:
        description: Name shown in the website dropdown (e.g. "Firenze vintage")
        required: true

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the list
        env:
          LIST_URL: ${{ inputs.url }}
          LIST_NAME: ${{ inputs.name }}
        run: python shop_route.py "$LIST_URL" --add "$LIST_NAME"
      - name: Commit
        env:
          LIST_NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists
          git commit -m "Add list: $LIST_NAME"
          git push
